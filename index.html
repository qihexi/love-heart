<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>为你跳动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    user-select: none;
  }

  /* ====== 背景漂浮光点 ====== */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 4s infinite alternate;
    pointer-events: none;
  }
  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8) translateY(0); }
    100% { opacity: 0.8; transform: scale(1.2) translateY(-20px); }
  }

  /* ====== 爱心容器 ====== */
  .heart-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 200px;
    height: 200px;
    filter: drop-shadow(0 0 35px rgba(255, 8, 68, 0.6));
    cursor: pointer;
    z-index: 10;
  }

  .heart {
    width: 160px;
    height: 160px;
    animation: heartbeat 1.2s infinite ease-in-out;
  }

  /* 匀速跳动 + 加速状态 */
  @keyframes heartbeat {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .heart-wrapper.fast .heart {
    animation: heartbeat 0.4s infinite ease-in-out;
  }

  /* ====== 点击弹出的文字 ====== */
  #message-box {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: #ffb3c6;
    font-size: 16px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 179, 198, 0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 20;
  }
  #message-box.show {
    animation: floatUpText 2s ease-out forwards;
  }
  @keyframes floatUpText {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -10px) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -20px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(0.8); }
  }

  /* ====== 点击粒子爆炸 ====== */
  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 14px;
    z-index: 5;
    animation: particleFly 1s ease-out forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); opacity: 0; }
  }

  /* ====== 心电图波纹 ====== */
  .ecg-line {
    width: 250px;
    height: 50px;
    margin-top: 30px;
    opacity: 0.6;
  }
  .ecg-path {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: ecgPulse 1.2s infinite linear;
  }
  @keyframes ecgPulse {
    0% { stroke-dashoffset: 200; }
    100% { stroke-dashoffset: -200; }
  }

  /* ====== 底部落款 ====== */
  .footer-text {
    position: absolute;
    bottom: 12%;
    color: rgba(255, 255, 255, 0.3);
    font-size: 13px;
    letter-spacing: 4px;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>

  <!-- 爱心主体 -->
  <div class="heart-wrapper" id="heartWrapper">
    <div id="message-box"></div>
    <svg class="heart" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff9a9e" />
          <stop offset="50%" stop-color="#ff0844" />
          <stop offset="100%" stop-color="#8a2387" />
        </linearGradient>
      </defs>
      <path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z" 
            fill="url(#heartGradient)" />
    </svg>
  </div>

  <!-- 心电图波纹 -->
  <svg class="ecg-line" viewBox="0 0 250 50">
    <path class="ecg-path" d="M 0 25 L 80 25 L 90 5 L 100 45 L 110 25 L 120 20 L 130 30 L 140 25 L 250 25" 
          fill="none" stroke="#ff0844" stroke-width="2" stroke-linejoin="round" />
  </svg>

  <!-- 底部落款 -->
  <div class="footer-text">
    爱你<br>
    <span style="font-size: 11px; opacity: 0.6;">为你跳动</span>
  </div>

  <script>
    // ==================== 配置区 ====================
    const messages = [
      "愿你所求皆如愿，所行化坦途。",
      "你是我在这平凡世界里的璀璨星辰。",
      "不管世界多吵，我永远偏心于你。",
      "生活明朗，万物可爱，你值得所有的美好。",
      "每一次跳动，都是我在对你说：我在。"
    ];
    // 粒子颜色
    const particleColors = ['#ff0844', '#ffb199', '#8a2387', '#ff9a9e', '#fff'];
    // ===============================================

    const heartWrapper = document.getElementById('heartWrapper');
    const messageBox = document.getElementById('message-box');
    let lastClickTime = 0;

    // 1. 生成背景漂浮光点
    function createStars() {
      for (let i = 0; i < 30; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.animationDuration = (Math.random() * 3 + 2) + 's';
        document.body.appendChild(star);
      }
    }

    // 2. 粒子爆炸效果
    function createParticles(rect) {
      const count = 15 + Math.floor(Math.random() * 10);
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = Math.random() > 0.5 ? '❤' : '✦';
        
        // 随机粒子大小
        const size = Math.random() * 10 + 10;
        particle.style.fontSize = size + 'px';
        particle.style.color = particleColors[Math.floor(Math.random() * particleColors.length)];
        
        // 初始位置在爱心中心
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';

        // 随机爆炸方向与距离
        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 100;
        const tx = Math.cos(angle) * distance + 'px';
        const ty = Math.sin(angle) * distance + 'px';
        
        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);

        document.body.appendChild(particle);
        
        // 动画结束后移除粒子
        setTimeout(() => {
          if (particle.parentNode) particle.parentNode.removeChild(particle);
        }, 1000);
      }
    }

    // 3. 点击爱心交互
    heartWrapper.addEventListener('click', (e) => {
      const rect = heartWrapper.getBoundingClientRect();
      
      // 粒子爆炸
      createParticles(rect);

      // 弹出随机文字
      const msg = messages[Math.floor(Math.random() * messages.length)];
      messageBox.textContent = msg;
      messageBox.classList.remove('show');
      void messageBox.offsetWidth; // 强制重绘
      messageBox.classList.add('show');

      // 心跳加速
      heartWrapper.classList.add('fast');
      
      // 如果连续点击，防止加速状态一直持续
      clearTimeout(window.speedTimer);
      window.speedTimer = setTimeout(() => {
        heartWrapper.classList.remove('fast');
      }, 800);
    });

    // 初始化
    createStars();
  </script>
</body>
</html>
